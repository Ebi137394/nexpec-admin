# Supabase Edge Functions configuration.
#
# Policy: verify_jwt = false ONLY for endpoints whose caller cannot present a
# Supabase JWT — Stripe-signed webhooks, the public connect redirect, the
# x-worker-secret worker, the raw vendor bridge token, and CRON_SECRET cron jobs.
# Every other function defaults to verify_jwt = true (a user or service-role JWT).
# See docs/ops/DEPLOY_RUNBOOK.md (Stage C1).

# ── Local development stack ──────────────────────────────────────────────────
#  Added so `supabase start` brings up the API gateway and GoTrue, not just
#  Postgres. Before this, config.toml declared ONLY [functions.*], so the CLI
#  started the database alone: `supabase start` exited 0 with one container, the
#  auth endpoint answered 000, and anything needing a real session could not run
#  locally. That blocked the money-flow Golden Path (scripts/qa/e2e-money-flow.mjs
#  calls auth.admin.createUser) and any local Web preview.
#
#  LOCAL ONLY. config.toml governs the local stack; hosted projects are
#  configured in the Supabase dashboard, so nothing here reaches staging or
#  Production. Ports match the ones this project has always used (54321/54322/
#  54324), so existing DB_URL/API_URL references keep working.

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# The mobile app requests redirectTo = Linking.createURL('reset-password'),
# which resolves to nexpec://reset-password in a standalone build (scheme is
# set in app.config.js) and to an exp:// URL under Expo Go. GoTrue rejects a
# redirectTo that is not on this list BEFORE the app ever sees it, so a
# recovery link opened on a device would silently fail without these.
additional_redirect_urls = [
  "https://127.0.0.1:3000",
  "nexpec://reset-password",
  "nexpec://oauth-callback",
  "nexpec://*",
  "exp://127.0.0.1:8081/--/reset-password",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Local only: skips the confirmation round-trip so fixtures and Golden Paths can
# create users directly. Hosted environments are unaffected by this file.
enable_confirmations = false

[inbucket]
enabled = true
port = 54324

[functions.critical-alert-monitor]
enabled = true
verify_jwt = true   # TODO confirm caller: if invoked by external cron via WEBHOOK_SECRET, set false
import_map = "./functions/critical-alert-monitor/deno.json"
entrypoint = "./functions/critical-alert-monitor/index.ts"

[functions.process-payout]
enabled = true
verify_jwt = true
import_map = "./functions/process-payout/deno.json"
entrypoint = "./functions/process-payout/index.ts"

# ── Endpoints with no Supabase JWT (would 401 under the default) ──────────────

[functions.stripe-payments-webhook]
enabled = true
verify_jwt = false   # Stripe signature (STRIPE_PAYMENTS_WEBHOOK_SECRET)

[functions.stripe-connect-webhook]
enabled = true
verify_jwt = false   # Stripe signature (STRIPE_CONNECT_WEBHOOK_SECRET)

[functions.stripe-connect-redirect]
enabled = true
verify_jwt = false   # public browser redirect

[functions.ai-analysis-worker]
enabled = true
verify_jwt = false   # in-house worker auths via x-worker-secret (WORKER_SHARED_SECRET)

[functions.vendor-bridge-auth]
enabled = true
verify_jwt = false   # vendors have no account; raw bridge token

[functions.dispatch-notification-emails]
enabled = true
verify_jwt = false   # cron-invoked via CRON_SECRET

[functions.refresh-fx-rates]
enabled = true
verify_jwt = false   # cron-invoked via CRON_SECRET

[functions.reconcile-ledger]
enabled = true
verify_jwt = false   # cron via RECON_CRON_SECRET; admin "Run now" via its own requireUser()

[functions.tax-vault]
enabled = true
verify_jwt = true    # caller JWT drives the owner/admin checks in the vault RPCs; key injected server-side

[functions.generate-dispute-report]
enabled = true
verify_jwt = true    # admin/internal; called with a bearer (service-role or user JWT)
entrypoint = "./functions/generate-dispute-report/mod.ts"   # entrypoint is mod.ts, not index.ts

[functions.tool-document]
enabled = true
verify_jwt = true    # a signed-in professional generates the document

[functions.telegram-dispatch]
verify_jwt = false   # invoked by pg_cron; authenticates with CRON_SECRET / service-role bearer

[functions.telegram-webhook]
verify_jwt = false   # Telegram cannot present a user JWT; authenticates with
                     # X-Telegram-Bot-Api-Secret-Token plus the chat allowlist
