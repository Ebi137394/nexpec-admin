# ════════════════════════════════════════════════════════════════════════════
#  CI — NEXPEC monorepo verification (P3.2)
#
#  RATCHETING by design: green on day one. Only checks that already pass are
#  blocking; the rest are `--if-present` (no-op until the script exists) or
#  `continue-on-error: true` (visible but non-blocking) until that surface goes
#  green. Flip each to blocking as you burn down the work — see the inline TODOs.
#
#  Toolchain: npm (package-lock.json is the lockfile of record). Do NOT switch to
#  yarn/turbo here until they're real devDependencies — see NEXPEC_P3_HARDENING_PLAN.md.
# ════════════════════════════════════════════════════════════════════════════
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # ── Blocking: green today ──────────────────────────────────────────────
      # Offline-integrity gate: no field screen may bypass the outbox — a direct
      # supabase write in app/(inspector) silently fails with no signal and loses
      # the inspector's evidence. Zero-dep, deterministic, green today. A new
      # bypass (or re-introducing one on a cleaned line) fails the build.
      - name: offline · outbox-routing guardrail
        run: node scripts/qa/check-outbox-routing.mjs

      # Offline replay proofs — 41 assertions that were NEVER run by any
      # workflow until now. These are the authorization and evidence-integrity
      # proofs for the offline drain path: that every ITP write goes through the
      # canonical RPC rather than a direct table write, and that two visits on
      # one job keep separate evidence through a single drain. Exactly the class
      # of invariant that breaks silently and is discovered in the field.
      #
      # Requires Node >= 22.15: the harness uses registerHooks from node:module
      # (src/core/offline/__tests__/harness.mjs). `node-version: 22` above
      # resolves to the latest 22.x, which satisfies that — but the requirement
      # is now declared explicitly in package.json engines and .nvmrc so pinning
      # a lower 22.x cannot silently break it.
      - name: offline · ITP replay (19 assertions)
        run: node --test src/core/offline/__tests__/itpReplay.test.mjs

      - name: offline · visit replay (22 assertions)
        run: node --test src/core/offline/__tests__/visitReplay.test.mjs

      - name: shared-core · typecheck
        run: npm run typecheck -w @nexpec/shared-core

      # Activates once vitest + a `test` script land in shared-core (P3.1).
      - name: shared-core · tests
        run: npm run test -w @nexpec/shared-core --if-present

      # apps/web is an ISOLATED install (excluded from the root workspace) so it
      # resolves only its own React 19 — see apps/web/next.config.mjs. The root
      # `npm ci` above does NOT install it, so install it on its own first.
      - name: web · install (isolated)
        run: cd apps/web && npm ci

      # Bug-only ESLint flat config (apps/web/eslint.config.mjs): crash-class
      # rules error, stylistic noise off/warn. Blocking.
      - name: web · lint
        run: cd apps/web && npm run lint

      # Now blocking: apps/web is tsc-clean — all 36 pre-existing errors cleared
      # (commit c070366). A new type error fails CI.
      - name: web · typecheck
        run: cd apps/web && npm run typecheck

  mobile-typecheck:
    name: mobile · typecheck
    runs-on: ubuntu-latest
    # BLOCKING as of the 372 -> 0 burndown. The root tsconfig is scoped to the
    # Expo app (apps/web + supabase excluded — each has its own gate above), and
    # the mobile tree is tsc-clean. A new mobile type error now fails CI.
    # NOTE: Babel still strips types for the EAS binary, so this gate is
    # correctness/hygiene, not a build blocker for the app artifact itself.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: mobile · tsc --noEmit
        # --max-old-space-size guards against OOM on the large React Native tree.
        run: npx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=4096
